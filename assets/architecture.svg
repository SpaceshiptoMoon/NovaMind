<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="926" viewBox="0 0 1180 926" role="img" aria-label="NovaMind 架构图">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
  </defs>
  <rect width="1180" height="926" fill="#ffffff"/>
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">

    <!-- ===== 客户端层 ===== -->
    <rect x="40" y="24" width="1100" height="72" rx="14" fill="#fafaf9" stroke="#e7e5e4"/>
    <text x="60" y="48" font-size="12" fill="#78716c" letter-spacing="1">客户端 · CLIENT</text>
    <rect x="290" y="38" width="600" height="44" rx="22" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="590" y="66" font-size="14" fill="#3f3f46" text-anchor="middle" font-weight="600">浏览器 — Vue 3 + TypeScript SPA</text>

    <line x1="590" y1="96" x2="590" y2="132" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="604" y="119" font-size="11.5" fill="#a8a29e">HTTP / SSE / WebSocket · :80</text>

    <!-- ===== 应用层 app 容器 ===== -->
    <rect x="40" y="136" width="1100" height="312" rx="14" fill="#f5f5f4" stroke="#e7e5e4"/>
    <text x="60" y="160" font-size="12" fill="#78716c" letter-spacing="1">应用层 · APP 容器（单 Docker 容器）</text>

    <rect x="440" y="172" width="300" height="40" rx="20" fill="#3f3f46"/>
    <text x="590" y="197" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="600">Nginx — 静态资源 · 反向代理</text>

    <line x1="590" y1="212" x2="590" y2="232" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="80" y="236" width="480" height="78" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="320" y="268" font-size="14.5" fill="#3f3f46" text-anchor="middle" font-weight="600">FastAPI :8100</text>
    <text x="320" y="292" font-size="11.5" fill="#78716c" text-anchor="middle">REST API · SSE 流式 · WebSocket 通知</text>

    <rect x="620" y="236" width="480" height="78" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="860" y="268" font-size="14.5" fill="#3f3f46" text-anchor="middle" font-weight="600">ARQ Worker — 嵌入式异步任务</text>
    <text x="860" y="292" font-size="11.5" fill="#78716c" text-anchor="middle">解析管道调度 · 断点续跑 · 节点级进度</text>

    <text x="80" y="340" font-size="11.5" fill="#a8a29e">features/ 业务模块</text>
    <g font-size="13" fill="#44403c" text-anchor="middle">
      <rect x="80"  y="348" width="250" height="38" rx="8" fill="#ffffff" stroke="#e7e5e4"/><text x="205" y="372">用户与模型配置</text>
      <rect x="343" y="348" width="250" height="38" rx="8" fill="#ffffff" stroke="#e7e5e4"/><text x="468" y="372">知识空间与知识库</text>
      <rect x="606" y="348" width="250" height="38" rx="8" fill="#ffffff" stroke="#e7e5e4"/><text x="731" y="372">RAG 问答</text>
      <rect x="869" y="348" width="250" height="38" rx="8" fill="#ffffff" stroke="#e7e5e4"/><text x="994" y="372">深度研究</text>
      <rect x="80"  y="396" width="250" height="38" rx="8" fill="#ffffff" stroke="#e7e5e4"/><text x="205" y="420">智能体 Agent</text>
      <rect x="343" y="396" width="250" height="38" rx="8" fill="#ffffff" stroke="#e7e5e4"/><text x="468" y="420">技能广场</text>
      <rect x="606" y="396" width="250" height="38" rx="8" fill="#ffffff" stroke="#e7e5e4"/><text x="731" y="420">应用中心</text>
      <rect x="869" y="396" width="250" height="38" rx="8" fill="#ffffff" stroke="#e7e5e4"/><text x="994" y="420">通知中心</text>
    </g>

    <line x1="590" y1="448" x2="590" y2="478" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="604" y="467" font-size="11.5" fill="#a8a29e">业务编排 · 引擎调用</text>

    <!-- ===== 引擎层 ===== -->
    <rect x="40" y="482" width="1100" height="150" rx="14" fill="#fafaf9" stroke="#e7e5e4"/>
    <text x="60" y="506" font-size="12" fill="#78716c" letter-spacing="1">引擎层 · ENGINES（可复用引擎）</text>
    <g text-anchor="middle">
      <rect x="45"  y="520" width="170" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="130" y="550" font-size="13.5" fill="#3f3f46" font-weight="600">文档解析管道</text>
      <text x="130" y="572" font-size="11" fill="#78716c">DeepDoc · OCR · VLM</text>
      <text x="130" y="588" font-size="11" fill="#78716c">faster-whisper ASR</text>

      <rect x="229" y="520" width="170" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="314" y="550" font-size="13.5" fill="#3f3f46" font-weight="600">RAG 检索</text>
      <text x="314" y="572" font-size="11" fill="#78716c">向量 · BM25 · 混合</text>
      <text x="314" y="588" font-size="11" fill="#78716c">查询改写 · Rerank</text>

      <rect x="413" y="520" width="170" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="498" y="550" font-size="13.5" fill="#3f3f46" font-weight="600">Agent 运行时</text>
      <text x="498" y="572" font-size="11" fill="#78716c">工具调用 · MCP</text>
      <text x="498" y="588" font-size="11" fill="#78716c">执行轨迹回放</text>

      <rect x="597" y="520" width="170" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="682" y="550" font-size="13.5" fill="#3f3f46" font-weight="600">效果评测</text>
      <text x="682" y="572" font-size="11" fill="#78716c">测试集 · 自动评测</text>
      <text x="682" y="588" font-size="11" fill="#78716c">人工复核 · 报告</text>

      <rect x="781" y="520" width="170" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="866" y="550" font-size="13.5" fill="#3f3f46" font-weight="600">搜索 Provider</text>
      <text x="866" y="572" font-size="11" fill="#78716c">Tavily · SerpAPI</text>
      <text x="866" y="588" font-size="11" fill="#78716c">DuckDuckGo</text>

      <rect x="965" y="520" width="170" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="1050" y="550" font-size="13.5" fill="#3f3f46" font-weight="600">深度研究编排</text>
      <text x="1050" y="572" font-size="11" fill="#78716c">多源规划 · 检索</text>
      <text x="1050" y="588" font-size="11" fill="#78716c">分步报告生成</text>
    </g>

    <line x1="590" y1="632" x2="590" y2="662" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="604" y="651" font-size="11.5" fill="#a8a29e">数据读写</text>

    <!-- ===== 基础设施层 ===== -->
    <rect x="40" y="666" width="1100" height="118" rx="14" fill="#f5f5f4" stroke="#e7e5e4"/>
    <text x="60" y="690" font-size="12" fill="#78716c" letter-spacing="1">基础设施层 · 独立容器编排</text>
    <g text-anchor="middle">
      <rect x="47" y="704" width="258" height="64" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="176" y="730" font-size="14" fill="#3f3f46" font-weight="600">MySQL 8.4</text>
      <text x="176" y="752" font-size="11" fill="#78716c">用户 · 知识库 · 任务 · Wiki</text>

      <rect x="323" y="704" width="258" height="64" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="452" y="730" font-size="14" fill="#3f3f46" font-weight="600">Redis 7</text>
      <text x="452" y="752" font-size="11" fill="#78716c">缓存 · 队列 · JWT 黑名单</text>

      <rect x="599" y="704" width="258" height="64" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="728" y="730" font-size="14" fill="#3f3f46" font-weight="600">Elasticsearch 9.3</text>
      <text x="728" y="752" font-size="11" fill="#78716c">向量 + BM25 混合索引</text>

      <rect x="875" y="704" width="258" height="64" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="1004" y="730" font-size="14" fill="#3f3f46" font-weight="600">MinIO</text>
      <text x="1004" y="752" font-size="11" fill="#78716c">文档原件 · 解析快照</text>
    </g>

    <line x1="590" y1="784" x2="590" y2="814" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="5 4"/>
    <text x="604" y="803" font-size="11.5" fill="#a8a29e">OpenAI 兼容 API</text>

    <!-- ===== 外部模型 ===== -->
    <rect x="40" y="818" width="1100" height="84" rx="14" fill="#ffffff" stroke="#a8a29e" stroke-dasharray="6 4"/>
    <text x="60" y="842" font-size="12" fill="#78716c" letter-spacing="1">外部模型 · 可插拔</text>
    <g font-size="13" fill="#44403c" text-anchor="middle">
      <rect x="60"  y="852" width="140" height="36" rx="18" fill="#fafaf9" stroke="#e7e5e4"/><text x="130" y="875">LLM</text>
      <rect x="214" y="852" width="140" height="36" rx="18" fill="#fafaf9" stroke="#e7e5e4"/><text x="284" y="875">Embedding</text>
      <rect x="368" y="852" width="140" height="36" rx="18" fill="#fafaf9" stroke="#e7e5e4"/><text x="438" y="875">Rerank</text>
      <rect x="522" y="852" width="140" height="36" rx="18" fill="#fafaf9" stroke="#e7e5e4"/><text x="592" y="875">VLM</text>
      <rect x="676" y="852" width="140" height="36" rx="18" fill="#fafaf9" stroke="#e7e5e4"/><text x="746" y="875">ASR</text>
    </g>
    <text x="840" y="875" font-size="12" fill="#78716c">内置本地模型：faster-whisper · DeepDoc</text>
  </g>
</svg>
