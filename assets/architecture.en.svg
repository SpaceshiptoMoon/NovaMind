      <text x="176" y="752" font-size="11" fill="#78716c">users · KBs · tasks · wiki</text>

      <rect x="323" y="704" width="258" height="64" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="452" y="730" font-size="14" fill="#3f3f46" font-weight="600">Redis 7</text>
      <text x="452" y="752" font-size="11" fill="#78716c">cache · queue · JWT blacklist</text>

      <rect x="599" y="704" width="258" height="64" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
