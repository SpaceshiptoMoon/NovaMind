      <rect x="214" y="852" width="140" height="36" rx="18" fill="#fafaf9" stroke="#e7e5e4"/><text x="284" y="875">Embedding</text>
      <rect x="368" y="852" width="140" height="36" rx="18" fill="#fafaf9" stroke="#e7e5e4"/><text x="438" y="875">Rerank</text>
      <rect x="522" y="852" width="140" height="36" rx="18" fill="#fafaf9" stroke="#e7e5e4"/><text x="592" y="875">VLM</text>
      <rect x="676" y="852" width="140" height="36" rx="18" fill="#fafaf9" stroke="#e7e5e4"/><text x="746" y="875">ASR</text>
    </g>
    <text x="840" y="875" font-size="12" fill="#78716c">bundled local: faster-whisper · DeepDoc</text>
