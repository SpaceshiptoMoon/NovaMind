<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="926" viewBox="0 0 1180 926" role="img" aria-label="NovaMind 架构图">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a29e"/>
    </marker>
  </defs>
  <rect width="1180" height="926" fill="#ffffff"/>
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">

    <!-- ===== 客户端层 ===== -->
    <rect x="40" y="24" width="1100" height="72" rx="14" fill="#fafaf9" stroke="#e7e5e4"/>
    <text x="60" y="48" font-size="12" fill="#78716c" letter-spacing="1">CLIENT</text>
    <rect x="290" y="38" width="600" height="44" rx="22" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="590" y="66" font-size="14" fill="#3f3f46" text-anchor="middle" font-weight="600">Browser — Vue 3 + TypeScript SPA</text>

