      <text x="682" y="588" font-size="11" fill="#78716c">human review · reports</text>

      <rect x="781" y="520" width="170" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="866" y="550" font-size="13.5" fill="#3f3f46" font-weight="600">Search providers</text>
      <text x="866" y="572" font-size="11" fill="#78716c">Tavily · SerpAPI</text>
      <text x="866" y="588" font-size="11" fill="#78716c">DuckDuckGo</text>

      <rect x="965" y="520" width="170" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="1050" y="550" font-size="13.5" fill="#3f3f46" font-weight="600">Research orchestration</text>
