      <text x="314" y="588" font-size="11" fill="#78716c">query rewrite · rerank</text>

      <rect x="413" y="520" width="170" height="96" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
      <text x="498" y="550" font-size="13.5" fill="#3f3f46" font-weight="600">Agent runtime</text>
      <text x="498" y="572" font-size="11" fill="#78716c">tool calls · MCP</text>
      <text x="498" y="588" font-size="11" fill="#78716c">trace replay</text>

