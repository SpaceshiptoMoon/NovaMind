[pytest]
# 测试发现
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# scripts/ 是运维与 E2E 脚本目录，非 pytest 测试目录，防止运维脚本
# 命中 *_test.py 发现模式被误收集（模块级副作用会炸 collection）
norecursedirs = .* build dist venv .venv node_modules scripts

# 输出配置
addopts = -v --tb=short --strict-markers

# 标记
markers =
    asyncio: 异步测试标记
    slow: 慢速测试标记
    integration: 集成测试标记
    unit: 单元测试标记

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
