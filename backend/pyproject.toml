[project]
name = "novamind"
version = "0.1.0"
description = "novamind - 智能知识库管理系统"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "argon2-cffi>=25.1.0",
    "bs4>=0.0.2",
    "fastapi>=0.128.0",
    "modelscope>=1.33.0",
    "openai>=2.14.0",
    "pdfplumber>=0.11.9",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    # ConfigLoader 加载仓库根 .env 供 YAML ${VAR} 占位符解析（此前仅是
    # pydantic-settings 的传递依赖，dotenv 是直接消费点，显式声明防漂移）
    "python-dotenv>=1.0.0",
    "pyjwt>=2.10.1",
    "redis[asyncio]>=5.2.0",
    "pypdf>=4.0.0",
    "python-docx>=1.2.0",
    # DeepDoc Office 格式解析：Excel（pandas + openpyxl）/ PPT（python-pptx）。
    # excel.py 顶层 import pandas，缺失则 Excel 文档解析直接 ModuleNotFoundError。
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "python-multipart>=0.0.21",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0",
    "structlog>=24.0.0",
    "uvicorn>=0.40.0",
    "websockets>=12.0",
    "pyyaml>=6.0.3",
    "jieba>=0.42.1",
    "tiktoken>=0.12.0",
    "elasticsearch>=9.3.0",
    "minio>=7.2.20",
    "slowapi>=0.1.9",
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.4",
    "tenacity>=8.2.0",
    "zai-sdk>=0.2.2",
    "docker>=7.0.0",
    "mcp[cli]>=1.6.0",
    "arq>=0.26",
    "dashscope>=1.25.19",
    "anthropic>=0.95.0",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "huggingface-hub>=1.10.2",
    "pymupdf>=1.28.0",
    "faster-whisper>=1.2.1",
    # DeepDoc PDF `full` 模式（默认）运行时：OCR 检测/版面/表格识别。
    # full 是默认 PDF 解析模式，故这些依赖为核心，uv sync 即装。
    # 仅 `plain` 模式（纯文字层）可不在运行时调用它们，但 import 仍需可用。
    # <3.1 上限：段落合并模型 updown_concat_xgb.model 是二进制格式，xgboost 3.1
    # 起移除二进制加载（实测 3.4.1 报 XGBoostError），会静默回退启发式合并。
    "xgboost>=2.0.0,<3.1",
    "opencv-python-headless>=4.8.0",
    "shapely>=2.0.0",
    "pyclipper>=1.4.0",
    # 公式识别（pix2text-mfr，full 模式默认开启）：此前仅是 faster-whisper 的
    # 传递依赖，公式识别直接 import 它们，显式声明防漂移。
    "onnxruntime>=1.19.0",
    "tokenizers>=0.20.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40.0",
]
transformers = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "sentence-transformers>=3.0.0",
]
dev = [
    "pip-audit>=2.7.0",
    "safety>=3.0.0",
    "ruff>=0.4.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "requests>=2.31.0",
    "aiosqlite>=0.20.0",
]
# DeepDoc vision 运行时：OCR / 版面识别 / 表格结构识别所需的额外重型依赖。
# core 部署无需安装；需要 PDF vision 模式（扫描件 OCR 等）时执行
# `uv pip install '.[deepdoc-vision]'`，并运行 `scripts/download_deepdoc_models.py` 拉取模型。
deepdoc-vision = [
    "xgboost>=2.0.0,<3.1",
    "opencv-python-headless>=4.8.0",
    # 公式模型 INT8 量化（download_formula_model 内动态量化，112MB→30MB）；
    # 缺此包时跳过量化回退 fp32，不阻断下载。
    "onnx>=1.16.0",
]

[project.scripts]
deepdoc = "novamind.engines.document.integrations.deepdoc.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"engines.document.integrations.deepdoc" = ["README.md"]
"engines.document.integrations.deepdoc.vendor.ragflow" = ["*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
# vendored DeepDoc 上游逐字镜像，禁止修改，整体豁免。
exclude = [
    "src/engines/document/integrations/deepdoc/vendor",
]

[tool.ruff.lint]
# 批次0门禁基线：先开 E,F,I,UP（行为相关），W/B 第二波再补。
# E501（行超长 1832 处存量）暂缓：line-length=100 保留供格式化参考，不做门禁，
# 待 W/B 第二波时再评估是否逐文件清零。
select = ["E", "F", "I", "UP"]
# 第二波再清（机械但有行为风险/涉及 vendored）：UP042 StrEnum 迁移改 str() 语义；UP031 % 格式化大量在 vendored 区
ignore = ["E501", "UP042", "UP031"]

[tool.ruff.lint.per-file-ignores]
# vendored DeepDoc 适配层（上游 import 结构原样保留）
"src/engines/document/integrations/deepdoc/parsers/upstream/**" = ["E402", "UP031"]
"src/engines/document/integrations/deepdoc/**" = ["F821", "E402"]
# tests 普遍先 sys.path.insert(BACKEND_ROOT) 再 import novamind（E402 是该模式的必然产物）；
# tests 的 F841（未用局部变量）第二波清
"tests/**" = ["E402", "F841"]
