# ========================================
# NovaMind - One-Command Docker Compose
# ========================================
# 推荐：用部署脚本一键部署（会先生成 .env / default.yaml 再启动）
#   bash deploy.sh deploy        # Windows: powershell -ExecutionPolicy Bypass -File deploy.ps1
# 其他命令：bash deploy.sh status|logs|stop|clean
#
# 仅当上述配置文件已存在时才可直接：
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# Runtime config file mounts:
#   ./backend/src/setting/yaml_config/yaml/default.yaml -> 容器内同路径（deploy 脚本已从
#     default.example 生成；*.yaml 不打进镜像，防止本地真实密钥泄漏进镜像层）。
#     这是唯一后端配置文件：凭据经 ${VAR} 从容器环境取值（env_file 的 .env 注入，
#     缺失即 None 显性报错）；连接参数在 yaml 占位符内带本地基线，Docker 值由
#     下方 environment 块显式覆盖（容器名/生产桶名/ES 免认证）。
#   ./backend/.cache/deepdoc -> /app/.cache/deepdoc（deepdoc 模型持久化卷：deploy 脚本
#     在部署期下载模型到此卷，容器重建不丢；缺失时运行期公式识别 WARNING 降级、
#     full 模式不可用）
#
# Infra ports (mysql/redis/minio/es) are bound to 127.0.0.1 so they are reachable
# only from the host, not exposed publicly. The app container reaches them over
# the `app-network` bridge, unaffected by this binding. If you deploy on a remote
# host and need external access to an infra port, change 127.0.0.1:<p>:<p> to <p>:<p>.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: novamind-app
    ports:
      - "80:8080"
    env_file:
      - .env
    environment:
      # 运行环境名（生产门控开关）：production 关闭 /docs、隐藏内部错误详情、
      # 启动安全校验阻断通配 CORS。默认 docker 开箱即用（注意：Swagger /docs 公网
      # 可见）；公网部署在 .env 设 ENVIRONMENT=production，且必须同时设
      # CORS_ORIGINS=https://你的域名（通配 * 会被校验以 CRITICAL 阻断启动）。
      ENVIRONMENT: "${ENVIRONMENT:-docker}"
      # Docker 部署的连接值（占位符注入，优先级高于 env_file 的 .env）：
      # .env 只存账户密码/凭据；本地开发的连接基线（127.0.0.1 系）在 default.yaml 占位符内。
      DB_HOST: mysql
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      # MinIO API 真实端点 = <compose 服务名>:<容器内 API 端口>，即下方 minio 服务
      # （server --address ":9005"）。app 容器经 app-network DNS 解析到它——与宿主机
      # 端口映射 127.0.0.1:9005 是两条路径，恰好同端口纯属巧合；改 minio 服务名或
      # --address 端口时这里必须同步（9001 是控制台端口，勿填）。
      MINIO_ENDPOINT: minio:9005
      # 生产桶名（区别于本地基线的 novamind-dev；首次上传时自动创建）
      MINIO_BUCKET: novamind
      # ES 端点必须带 scheme（yaml 占位符基线也是带 scheme 的完整 URL）
      ES_HOST: http://elasticsearch:9200
      # 空串 = ES 客户端 falsy 短路免认证（compose 的 ES 已关 security）
      ES_USERNAME: ""
      ES_PASSWORD: ""
      # 运行期模型兜底下载源（部署期下载失败时才触达）。值透传自 .env 的
      # HF_ENDPOINT（.env.example 默认国内镜像 hf-mirror.com；海外删除该行或
      # 设为官方源）。功能代码默认官方源，国内便利只进部署配置。
      # 主源失败后的降级换源清单由 .env 的 DEEPDOC_MIRRORS（JSON 数组）注入，
      # 地址全部在部署配置里，代码只含换源机制（格式见 .env.example）。
      HF_ENDPOINT: "${HF_ENDPOINT:-https://huggingface.co}"
    volumes:
      - ./backend/src/setting/yaml_config/yaml/default.yaml:/app/src/setting/yaml_config/yaml/default.yaml:ro
      - ./backend/.cache/deepdoc:/app/.cache/deepdoc
      # 本地 ASR 默认模型（faster-whisper-tiny）：deploy 脚本部署期下载到此卷，
      # 容器重建不丢；运行时音频解析默认协议 local 即从此目录加载模型。
      - ./backend/.cache/faster-whisper:/app/.cache/faster-whisper
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    # 与基础设施服务保持一致的常驻语义：宿主机重启后自动拉起；
    # 崩溃时 Docker 自带指数退避重启，无需 on-failure 的额外重试语义
    restart: unless-stopped
    networks:
      - app-network

  mysql:
    image: mysql:8.4.10
    container_name: novamind-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 不把密码写进 healthcheck 命令（docker inspect 可见）；mysqladmin ping 在
      # 未认证时也返回 "mysqld is alive"（服务器存活探测不依赖认证通过）
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 40s
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7.4.9-alpine
    container_name: novamind-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network

  minio:
    # MinIO 社区版自 2025-10 起停止发布官方 Docker 镜像（12 月进入维护模式，
    # 仅源码分发），官方源为 quay.io。此处钉在 cutoff 前最后可拉取的 release，
    # 升级需自行从源码构建或改用商业镜像，见 https://github.com/minio/minio/releases
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: novamind-minio
    ports:
      - "127.0.0.1:9005:9005"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      # mc ready 用的别名：指向本机 API 端口（凭据同上，不额外引入新密钥）
      MC_HOST_local: "http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@localhost:9005"
    command: server /data --address ":9005" --console-address ":9001"
    # 官方镜像不含 curl；用镜像内捆绑的 mc ready 做就绪探测（等 API 端口
    # 可服务，比 liveness 的 /minio/health/live 更贴合 depends_on 语义）。
    # MC_HOST 别名指向本机服务，凭据来自启动环境变量。
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - app-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.7
    container_name: novamind-elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 50s
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql-data:
  redis-data:
  minio-data:
  es-data:

networks:
  app-network:
    driver: bridge