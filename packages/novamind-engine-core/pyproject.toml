[project]
name = "novamind-engine-core"
version = "0.1.0"
description = "NovaMind 引擎共享底座——AI 客户端、存储客户端、提示词管理、端口协议与引擎自用配置的可嵌入独立库"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "openai>=2.14.0",
    "elasticsearch>=9.3.0",
    "minio>=7.2.20",
    "tenacity>=8.2.0",
    "tiktoken>=0.12.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.95.0",
]
transformers = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "sentence-transformers>=3.0.0",
]
dev = [
    "ruff>=0.4.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "strict"