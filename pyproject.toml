# NovaMind 仓库根打包配置。
#
# 本文件只做两件事：
#   1. 声明 uv workspace 成员（宿主 backend + 引擎包 packages/*）。
#   2. 声明内部包之间的 workspace editable source，使 `uv pip install -e .` 能把
#      引擎包以 editable 方式装进宿主环境，互相 import 解析到源码目录。
#
# 注意：本文件**不**定义任何包的依赖或构建后端——每个包自带 `pyproject.toml`。
# 它也不是构建产物清单，仅作为 uv workspace 的聚合点。

[tool.uv.workspace]
members = ["backend", "packages/*"]

[tool.uv.sources]
# 内部引擎包以 workspace editable 解析（`uv pip install -e` 等价命中源码）。
novamind-engine-core = { workspace = true }
novamind-rag-engine = { workspace = true }