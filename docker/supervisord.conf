# NovaMind Supervisord - non-root main config
# No [unix_http_server] (would need a socket in root-owned /run).
# pidfile under /tmp; container runs as appuser (see Dockerfile USER).

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor

[program:nginx]
# 先渲染模板（TLS 块按 NGINX_TLS_CERT/_KEY 剔除或保留，client_max_body_size 按
# NGINX_MAX_BODY_SIZE 注入）再启动 nginx；渲染失败 supervisord 会按 autorestart
# 重试并把错误打到 nginx-error.log，部署期即可发现配置问题。
command=/bin/sh -c "/usr/local/bin/render-nginx-conf.sh && exec nginx -c /tmp/nginx/nginx.conf -g 'daemon off;'"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx-access.log
stderr_logfile=/var/log/supervisor/nginx-error.log

[program:backend]
# 单一模式：无环境名参数，配置一律读挂载的 default.yaml
command=python main.py --host 127.0.0.1 --port 8100
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/backend-access.log
stderr_logfile=/var/log/supervisor/backend-error.log
startsecs=5

[program:parse_worker]
# 解析管道独立 worker：backend=stream 时消费 nm:parse:tasks 流；
# backend=arq（默认）时进程自检测退出（parse_worker.py 首行守卫），
# supervisord 报 EXITED 不重启（autorestart=false）——切流由 YAML 决定。
# startsecs 必须为 0：该进程不到 1 秒就退出，若保留存活确认时间（如 3），
# supervisord 会把这次退出当作启动失败，重试到 FATAL 而不是记为正常 EXITED。
command=python parse_worker.py
directory=/app
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/var/log/supervisor/parse-worker.log
stderr_logfile=/var/log/supervisor/parse-worker-error.log