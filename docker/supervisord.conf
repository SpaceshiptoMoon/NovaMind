# NovaMind Supervisord - non-root main config
# No [unix_http_server] (would need a socket in root-owned /run).
# pidfile under /tmp; container runs as appuser (see Dockerfile USER).

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor

[program:nginx]
# 先渲染模板（TLS 块按 NGINX_TLS_CERT/_KEY 剔除或保留，client_max_body_size 按
# NGINX_MAX_BODY_SIZE 注入）再启动 nginx；渲染失败 supervisord 会按 autorestart
# 重试并把错误打到 nginx-error.log，部署期即可发现配置问题。
command=/bin/sh -c "/usr/local/bin/render-nginx-conf.sh && exec nginx -c /tmp/nginx/nginx.conf -g 'daemon off;'"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx-access.log
stderr_logfile=/var/log/supervisor/nginx-error.log

[program:backend]
command=python main.py --config docker --host 127.0.0.1 --port 8100
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/backend-access.log
stderr_logfile=/var/log/supervisor/backend-error.log
startsecs=5