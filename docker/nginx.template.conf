# NovaMind Nginx - non-root main config (template)
# No `user` directive (master runs as the invoking non-root user).
# pid and all temp paths live under /tmp so no privileged dir is written.
# Logs go to stdout/stderr for `docker logs`.
#
# 本文件是模板：${NGINX_MAX_BODY_SIZE}/${NGINX_TLS_CERT}/${NGINX_TLS_KEY} 占位由
# docker/render-nginx-conf.sh 在容器启动时渲染到 /tmp/nginx/nginx.conf。
# TLS 块用成对标记包裹（##TLS-REDIRECT-*、##TLS-OFF-*、##TLS-SERVER-*）：
# 启用 TLS 时剔除 ##TLS-OFF-* 块，未启用时剔除 ##TLS-REDIRECT-* 与 ##TLS-SERVER-* 块。
# 不要直接编辑生成物。

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # WebSocket 升级映射：带 Upgrade header（WS）→ Connection upgrade；
    # 无 Upgrade（SSE/普通 HTTP）→ Connection ''。聊天流式改 WS 后必需。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    # Non-root writable temp paths (all under /tmp).
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        server_name _;

        # 健康检查反代（/health 系列端点在后端根路由，非 /api 前缀）。
        # TLS 启用时也保留在明文 server 上：容器 HEALTHCHECK 走本机 HTTP，
        # 不应依赖证书有效才能探活。
        location /health {
            proxy_pass http://127.0.0.1:8100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        ##TLS-REDIRECT-BEGIN
        # TLS 启用时：明文 server 除 /health 外全局 301 到 HTTPS。
        location / {
            return 301 https://$host$request_uri;
        }
        ##TLS-REDIRECT-END

        ##TLS-OFF-BEGIN
        # TLS 未配置时：明文 server 直接服务全部流量（历史行为）。
        # 注意：/docs /redoc /openapi.json 刻意不反代——Swagger 不对公网暴露，
        # 公网防护挡在这一层（后端本身 docs 常开，本地直连 :8100 调试用）。
        # 未匹配的路径落入下方 SPA 静态规则。
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 上传体积上限：由 NGINX_MAX_BODY_SIZE 注入（默认 2100m，
            # 与后端 video 模态 2000MB 流式硬顶留裕量）
            client_max_body_size ${NGINX_MAX_BODY_SIZE};

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 3600s;

            # WebSocket 升级支持（聊天流式改 WS 后必需）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;

            # SSE 兼容（过渡期保留；WS 请求不受 buffering 影响）
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
        }
        ##TLS-OFF-END
    }

    ##TLS-SERVER-BEGIN
    server {
        # TLS server：仅当 NGINX_TLS_CERT/_KEY 均非空时由渲染脚本保留。
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate ${NGINX_TLS_CERT};
        ssl_certificate_key ${NGINX_TLS_KEY};
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 大文件上传/下载的长时传输保护
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # 注意：/docs /redoc /openapi.json 刻意不反代（同明文 server 注释）。
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            client_max_body_size ${NGINX_MAX_BODY_SIZE};

            # WebSocket 升级支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location ~ /\. {
            deny all;
        }
    }
    ##TLS-SERVER-END
}
