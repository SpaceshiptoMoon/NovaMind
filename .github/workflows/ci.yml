name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-smoke:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies (from uv.lock)
        working-directory: backend
        # lint 依赖 ruff（dev 组）——test extra 不含它，缺 dev 会让 lint 步骤
        # 直接 program not found（run 109 起持续 failure 的真根因）
        run: uv sync --frozen --extra test --extra dev

      - name: Run backend lint
        working-directory: backend
        run: uv run ruff check .

      - name: Run backend unit tests
        working-directory: backend
        # FAILED 行转 ::error annotation：无需日志权限即可从 check annotations
        # 读到失败清单（跨平台差异失败定位依赖它）；非 FAILED 退出（收集错误/
        # 导入错误）时输出日志尾部 60 行辅助定位
        run: |
          uv run pytest -m unit -q -rf --tb=short 2>&1 | tee pytest_unit.log
          code=${PIPESTATUS[0]}
          grep -E "^FAILED" pytest_unit.log | while read -r line; do
            echo "::error ::$line"
          done
          if [ $code -ne 0 ] && ! grep -qE "^FAILED" pytest_unit.log; then
            echo "::error ::unit 非测试失败退出，日志尾部："
            tail -60 pytest_unit.log | while IFS= read -r line; do
              echo "::error ::$line"
            done
          fi
          exit $code

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run type check
        working-directory: frontend
        run: npm run type-check

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:unit -- --run

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime config
        run: |
          cp .env.example .env
          cp backend/src/setting/yaml_config/yaml/default.example backend/src/setting/yaml_config/yaml/default.yaml

      - name: Build app image
        run: docker compose build app
